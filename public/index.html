<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每日前沿科技与 GitHub 趋势简报</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090f;
      --glass: rgba(255, 255, 255, 0.045);
      --glass-hover: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.09);
      --line: rgba(255, 255, 255, 0.06);
      --text: #e6edf3;
      --muted: #94a3b8;
      --accent: #5eead4;
      --accent-2: #a78bfa;
      --radius: 18px;
      --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(60rem 40rem at 5% -10%, rgba(94, 234, 212, 0.16), transparent 60%),
        radial-gradient(50rem 40rem at 100% 5%, rgba(167, 139, 250, 0.18), transparent 60%),
        radial-gradient(40rem 30rem at 50% 115%, rgba(56, 189, 248, 0.12), transparent 60%),
        var(--bg);
      background-attachment: fixed;
    }
    /* 背景网格，营造终端/蓝图感 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
    }
    .wrap { position: relative; max-width: 1180px; margin: 0 auto; padding: 48px 24px 64px; }
    header { margin-bottom: 28px; }
    .prompt { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 0.06em; margin: 0; }
    .prompt .caret { display: inline-block; width: 0.6em; height: 1em; vertical-align: -0.15em; background: var(--accent); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    h1 {
      margin: 10px 0 6px;
      font-size: clamp(28px, 4.5vw, 44px);
      line-height: 1.15;
      font-weight: 700;
      background: linear-gradient(90deg, #fff 0%, var(--accent) 55%, var(--accent-2) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .date-line { margin: 0; font-family: var(--mono); font-size: 15px; color: var(--muted); }
    .date-line time { color: var(--text); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card {
      position: relative;
      padding: 22px 22px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02) 40%), var(--glass);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset, 0 20px 50px -20px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      min-width: 0;
    }
    .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .card h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.02em; }
    .card h2 .tag { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-right: 8px; }
    .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
    ol { list-style: none; margin: 0; padding: 0; }
    li + li { border-top: 1px solid var(--line); }
    .item {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      padding: 12px 8px;
      margin: 0 -8px;
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .item:hover { background: var(--glass-hover); }
    .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .rank { font-family: var(--mono); font-size: 13px; color: var(--muted); padding-top: 2px; }
    .title { display: block; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
    .desc {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 4px;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--muted);
    }
    .stats { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 8px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
    .lang { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
    .source {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--accent-2);
    }
    .analysis { margin-top: 20px; padding: 28px 30px 26px; }
    .analysis::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(120deg, rgba(94, 234, 212, 0.6), rgba(167, 139, 250, 0.6), transparent 70%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .analysis-body { font-size: 16px; line-height: 1.95; letter-spacing: 0.01em; }
    .analysis-body p { margin: 0 0 0.9em; }
    .analysis-body p:last-child { margin-bottom: 0; }
    .state { padding: 28px 8px; text-align: center; color: var(--muted); font-size: 14px; }
    .state code { font-family: var(--mono); color: var(--accent); }
    .skeleton { height: 54px; margin: 10px 0; border-radius: 10px; background: linear-gradient(90deg, var(--glass), var(--glass-hover), var(--glass)); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    footer { margin-top: 24px; font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .wrap { padding-top: 32px; }
      .analysis { padding: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .prompt .caret, .skeleton { animation: none; }
      .item { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="prompt">$ daily-brief --today <span class="caret" aria-hidden="true"></span></p>
      <h1>每日前沿科技与 GitHub 趋势简报</h1>
      <p class="date-line"><time id="today"></time></p>
    </header>

    <main>
      <div class="grid">
        <section class="card" aria-labelledby="gh-title">
          <div class="card-head">
            <h2 id="gh-title"><span class="tag" aria-hidden="true">[01]</span>GitHub 热门 Top 5</h2>
            <span class="meta" id="gh-meta"></span>
          </div>
          <div id="gh-list" aria-live="polite" aria-busy="true">
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
          </div>
        </section>

        <section class="card" aria-labelledby="news-title">
          <div class="card-head">
            <h2 id="news-title"><span class="tag" aria-hidden="true">[02]</span>AI 前沿快讯</h2>
            <span class="meta">via Hacker News</span>
          </div>
          <div id="news-list" aria-live="polite" aria-busy="true">
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
          </div>
        </section>
      </div>

      <section class="card analysis" aria-labelledby="ai-title">
        <div class="card-head">
          <h2 id="ai-title"><span class="tag" aria-hidden="true">[03]</span>今日技术趋势与解读</h2>
          <span class="meta" id="ai-meta"></span>
        </div>
        <div class="analysis-body" id="analysis" aria-live="polite" aria-busy="true">
          <div class="skeleton"></div><div class="skeleton"></div>
        </div>
      </section>
    </main>

    <footer>数据来源：GitHub Trending / GitHub Search API · Hacker News · 分析由大模型生成，仅供参考</footer>
  </div>
  <script>
    // GitHub linguist 常用语言配色；未收录的语言用灰色
    const LANG_COLORS = {
      JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5', Java: '#b07219', Go: '#00ADD8',
      Rust: '#dea584', 'C++': '#f34b7d', C: '#555555', 'C#': '#178600', Ruby: '#701516', PHP: '#4F5D95',
      Swift: '#F05138', Kotlin: '#A97BFF', Dart: '#00B4AB', Shell: '#89e051', HTML: '#e34c26', CSS: '#563d7c',
      Vue: '#41b883', Svelte: '#ff3e00', 'Jupyter Notebook': '#DA5B0B', Lua: '#000080', Zig: '#ec915c',
      Scala: '#c22d40', Elixir: '#6e4a7e', Haskell: '#5e5086', 'Objective-C': '#438eff', MDX: '#fcb32c',
      Nix: '#7e7eff', Dockerfile: '#384d54', Julia: '#a270ba', R: '#198CE7', Clojure: '#db5855',
      Solidity: '#AA6746', Cuda: '#3A4E3A', Mojo: '#ff4c1f', Astro: '#ff5a03',
    };
    const DEFAULT_LANG_COLOR = '#8b949e';
    const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const numberFmt = new Intl.NumberFormat('zh-CN');
    const $ = (id) => document.getElementById(id);

    // 所有外部数据一律通过 textContent 写入，不拼接 HTML，避免 XSS
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    // 链接只接受 http/https
    function safeHref(url) {
      try {
        const u = new URL(url);
        return u.protocol === 'http:' || u.protocol === 'https:' ? u.href : null;
      } catch {
        return null;
      }
    }

    function localDateString(d) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    // dateStr 形如 2026-11-06；优先使用服务器返回的日期，与简报的归档日期保持一致
    function setToday(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const weekday = WEEKDAYS[new Date(y, m - 1, d).getDay()];
      const time = $('today');
      time.dateTime = dateStr;
      time.textContent = `${dateStr} · ${weekday}`;
    }

    // 生成可点击的列表项；链接不安全时退化为不可点击的 div
    function listItem(index, url) {
      const href = safeHref(url);
      const box = el(href ? 'a' : 'div', 'item');
      if (href) {
        box.href = href;
        box.target = '_blank';
        box.rel = 'noopener noreferrer';
      }
      box.append(el('span', 'rank', String(index + 1).padStart(2, '0')));
      const body = el('div');
      box.append(body);
      const li = el('li');
      li.append(box);
      return { li, body };
    }

    function renderRepos(repos) {
      const ol = el('ol');
      repos.forEach((repo, i) => {
        const { li, body } = listItem(i, repo.url);
        body.append(el('span', 'title', repo.name));
        if (repo.description) body.append(el('span', 'desc', repo.description));
        const stats = el('div', 'stats');
        const lang = el('span', 'lang');
        const dot = el('span', 'dot');
        const color = LANG_COLORS[repo.language] || DEFAULT_LANG_COLOR;
        dot.style.backgroundColor = color;
        dot.style.color = color;
        dot.setAttribute('aria-hidden', 'true');
        lang.append(dot, el('span', null, repo.language || '未知语言'));
        stats.append(lang, el('span', null, `★ ${numberFmt.format(repo.stars)}`));
        body.append(stats);
        ol.append(li);
      });
      return ol;
    }

    function renderNews(news) {
      const ol = el('ol');
      news.forEach((item, i) => {
        const { li, body } = listItem(i, item.url);
        body.append(el('span', 'title', item.title), el('span', 'source', item.source));
        ol.append(li);
      });
      return ol;
    }

    // 按空行或换行分段渲染分析文本
    function renderAnalysis(text) {
      const frag = document.createDocumentFragment();
      text.split(/\n+/).map((s) => s.trim()).filter(Boolean).forEach((p) => frag.append(el('p', null, p)));
      return frag;
    }

    function fill(id, content) {
      const box = $(id);
      box.replaceChildren(content);
      box.setAttribute('aria-busy', 'false');
    }

    function stateBox(message, hint) {
      const box = el('div', 'state', message);
      if (hint) {
        box.append(el('br'));
        box.append(el('code', null, hint));
      }
      return box;
    }

    function showAll(message, hint) {
      ['gh-list', 'news-list', 'analysis'].forEach((id) => fill(id, stateBox(message, hint)));
    }

    async function load() {
      setToday(localDateString(new Date()));
      let res;
      let data;
      try {
        res = await fetch('/api/reports/today', { headers: { Accept: 'application/json' } });
        data = await res.json();
      } catch {
        showAll('简报加载失败，请检查服务是否运行后刷新页面。');
        return;
      }
      if (data && typeof data.date === 'string') setToday(data.date);

      if (res.status === 404) {
        showAll('今日简报尚未生成，每天 08:00 自动生成，也可以手动触发：', 'POST /api/reports/generate');
        return;
      }
      if (!res.ok) {
        showAll(`简报加载失败（HTTP ${res.status}），请稍后刷新。`);
        return;
      }

      const repos = Array.isArray(data.githubTrending) ? data.githubTrending : [];
      const news = Array.isArray(data.aiNews) ? data.aiNews : [];
      fill('gh-list', repos.length ? renderRepos(repos) : stateBox('暂无数据'));
      fill('news-list', news.length ? renderNews(news) : stateBox('暂无数据'));
      fill('analysis', data.aiAnalysis ? renderAnalysis(data.aiAnalysis) : stateBox('暂无分析'));

      // 标明榜单口径与数据日期：isboyjc 停更时会降级为"近 7 天新项目"
      $('gh-meta').textContent = data.githubSource === 'search'
        ? `近 7 天新项目 · ${data.githubDataDate}`
        : `Trending · ${data.githubDataDate}`;
      if (data.generatedAt) {
        const t = new Date(data.generatedAt);
        $('ai-meta').textContent = `生成于 ${t.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
      }
    }

    load();
  </script>
</body>
</html>
