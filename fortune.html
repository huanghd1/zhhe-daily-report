<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>赛博算命机</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      background: #fafafa;
      color: #222;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 2rem;
    }
    button {
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      border: 1px solid #222;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: #222;
      color: #fff;
    }
    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }
    #result {
      margin-top: 2rem;
      max-width: 28rem;
      min-height: 3rem;
      text-align: center;
      font-size: 1.05rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>赛博算命机</h1>
  <button id="draw" type="button">赛博求签</button>
  <p id="result" role="status" aria-live="polite"></p>

  <script>
    // 后端地址，服务需先通过 npm run dev 或 npm start 启动
    const button = document.getElementById('draw');
    const result = document.getElementById('result');

    button.addEventListener('click', async () => {
      button.disabled = true;
      result.textContent = '天机推演中……';
      try {
        // 相对路径：页面由同一服务提供，无需写死主机和端口
        const res = await fetch('/api/fortune');
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        result.textContent = data.fortune;
      } catch (err) {
        result.textContent = '签筒卡住了，请确认后端已启动（' + err.message + '）';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
